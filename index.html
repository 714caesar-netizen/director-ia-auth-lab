
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy"
 content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src https://kmswrsozavxbzadtwwpn.supabase.co; form-action 'none'; base-uri 'none'">
<title>Director IA | RLS LAB</title>
<style>
body{background:#101827;color:#f4f6fa;font-family:system-ui,sans-serif;padding:20px}
main{max-width:460px;margin:35px auto;padding:25px;background:#192438;border:1px solid #344154;border-radius:16px}
label{display:block;margin-top:16px}
input,button{box-sizing:border-box;width:100%;padding:13px;margin-top:8px;border-radius:8px;font-size:16px}
button{background:#6ee7b7;border:0;font-weight:bold}
button:disabled{opacity:.5}
input{border:1px solid #64748b}
#result{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:22px}
small{color:#bac5d5}
</style>
</head>
<body>
<main>
<h1>Director IA</h1>
<h2>Prueba de permisos RLS</h2>
<p>Laboratorio temporal. Sin datos reales.</p>

<label>Correo ficticio</label>
<input id="email" type="email" autocomplete="off">

<label>Contraseña ficticia</label>
<input id="password" type="password" autocomplete="off">

<button id="signed" type="button">
Probar usuario autenticado
</button>

<button id="anonymous" type="button">
Probar visitante anónimo
</button>

<p id="result" role="status" aria-live="polite">
Sin iniciar prueba.
</p>

<small>
Solo lectura. No se almacenan tokens.
No usar cuentas reales.
</small>
</main>
<script>
"use strict";

const BASE="https://kmswrsozavxbzadtwwpn.supabase.co";
const KEY="sb_publishable_9fzDnyKmyOiFImW3OumCKg_2YZ6SWdz";
const TABLE="director_auth_rls_lab_20261120";
const output=document.getElementById("result");
const buttons=document.querySelectorAll("button");

function busy(value){
  buttons.forEach(b=>b.disabled=value);
}

async function readRows(token){
  const headers={"apikey":KEY};
  if(token) headers.Authorization="Bearer "+token;

  const r=await fetch(
    BASE+"/rest/v1/"+TABLE+"?select=id,label",
    {headers,cache:"no-store"}
  );

  if(!r.ok){
    throw new Error("Lectura HTTP "+r.status);
  }

  const rows=await r.json();
  if(!Array.isArray(rows)){
    throw new Error("Respuesta inesperada");
  }
  return rows;
}

document.getElementById("anonymous").onclick=async()=>{
  busy(true);
  output.textContent="Probando acceso anónimo...";
  try{
    const rows=await readRows(null);
    output.textContent=
      "ANÓNIMO\nHTTP 200\nRegistros visibles: "+
      rows.length+"\n"+
      (rows.length===0?"PASS: sin acceso al registro":
       "FAIL: registro visible");
  }catch(e){
    output.textContent="ERROR: "+e.message;
  }finally{busy(false);}
};

document.getElementById("signed").onclick=async()=>{
  const email=document.getElementById("email").value.trim();
  const field=document.getElementById("password");
  const password=field.value;
  field.value="";

  if(!email||!password){
    output.textContent="Introduce las credenciales ficticias.";
    return;
  }

  busy(true);
  output.textContent="Autenticando y verificando RLS...";
  let token=null;

  try{
    const login=await fetch(
      BASE+"/auth/v1/token?grant_type=password",
      {
        method:"POST",
        cache:"no-store",
        headers:{
          "apikey":KEY,
          "Content-Type":"application/json"
        },
        body:JSON.stringify({email,password})
      }
    );

    if(!login.ok){
      throw new Error("Inicio de sesión rechazado");
    }

    const session=await login.json();
    token=session.access_token;

    const who=await fetch(BASE+"/auth/v1/user",{
      headers:{
        "apikey":KEY,
        "Authorization":"Bearer "+token
      },
      cache:"no-store"
    });

    if(!who.ok){
      throw new Error("No se verificó la identidad");
    }

    const user=await who.json();
    const rows=await readRows(token);

    const owner=
      user.id==="5eb29fca-1278-47ee-a2a4-2cec42f209f4";
    const expected=owner?1:0;

    output.textContent=
      "IDENTIDAD: "+user.email+
      "\nLECTURA HTTP: 200"+
      "\nREGISTROS VISIBLES: "+rows.length+
      "\nRESULTADO: "+
      (rows.length===expected?"PASS":"FAIL")+
      "\nESPERADOS: "+expected;
  }catch(e){
    output.textContent="ERROR: "+e.message;
  }finally{
    if(token){
      try{
        const logout=await fetch(BASE+"/auth/v1/logout",{
          method:"POST",
          cache:"no-store",
          headers:{
            "apikey":KEY,
            "Authorization":"Bearer "+token
          }
        });
        if(!logout.ok){
          output.textContent+="\nAVISO: cierre no confirmado.";
        }
      }catch(_){
        output.textContent+="\nAVISO: cierre no confirmado.";
      }
    }
    token=null;
    busy(false);
  }
};
</script>
</body>
</html>
